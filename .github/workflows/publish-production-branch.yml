# Publishes a BUILT site to a deploy branch that Hostinger's Advanced → Git feature can deploy
# into a directory:
#   target: staging    → branch `staging`    — STAGING build: every page noindex, no canonical/og:url/JSON-LD,
#                        robots.txt lists no sitemap (crawling allowed so the noindex is seen), no sitemap
#                        files, X-Robots-Tag header in .htaccess. For a password-protected staging subdomain.
#   target: production → branch `production` — the RELEASE GATE (site/scripts/release-gate.mjs: full test suite, clean
#                        production build, publication report, release-readiness check incl. owner legal details) must
#                        pass; requires typing PUBLISH; tags a release.
#   target: verify     → NO deploy branch, never pushes: runs exactly the production job's checks (the release gate)
#                        and reports the result. CI calls this workflow with target verify (workflow_call) on every
#                        push, so the real publishing workflow is exercised without deploying anything.
#
# TRIGGERS: (1) the "Run workflow" button (workflow_dispatch) — GitHub shows it only once this file is on the
# default branch; (2) pushing a tag named publish-production-<stamp> or publish-staging-<stamp> to the commit
# to publish, or creating/updating a branch named publish-production or publish-staging at that commit (the
# GitHub API can create such a branch when tags cannot be pushed) — both work while this file lives only on
# the working branch. The publish-* branch is a pointer to the source commit, never the deploy branch itself.
# SAFETY: the target is validated and anything other than the two names fails the job, so no other branch
# (e.g. main) can ever be the push target; production needs the explicit confirmation (typed PUBLISH, or the
# explicit publish-production-* tag name). Nothing deploys until the owner has connected Hostinger Git to the
# chosen branch and directory. See HOSTING_AND_DEPLOYMENT_ASSESSMENT.md and SECURITY_AND_RELEASE_CHECKLIST.md.
name: Publish deploy branch

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        type: choice
        options: [verify, staging, production]
        default: verify
        required: true
      confirm:
        description: 'For production only: type PUBLISH to confirm SECURITY_AND_RELEASE_CHECKLIST.md is complete'
        required: false
        default: ''
  workflow_call:
    inputs:
      target:
        description: 'Only "verify" is accepted from a workflow call (never staging or production)'
        type: string
        default: verify
      expect:
        description: 'verify only: "blocked" (the gate must refuse, e.g. while owner legal details are missing) or "pass"'
        type: string
        default: blocked
  push:
    tags:
      - 'publish-production-*'
      - 'publish-staging-*'
    branches:
      - publish-production
      - publish-production-interim
      - publish-staging

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate target
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_EXPECT: ${{ inputs.expect }}
        run: |
          if [ -n "$INPUT_TARGET" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            # workflow_call (from CI): only the non-deploying verify target is ever accepted.
            if [ "$INPUT_TARGET" != "verify" ]; then echo "a workflow call may only run target verify, not '$INPUT_TARGET'"; exit 1; fi
            case "$INPUT_EXPECT" in blocked|pass) ;; *) echo "expect must be blocked or pass, not '$INPUT_EXPECT'"; exit 1 ;; esac
            TARGET=verify; CONFIRM=""
            echo "EXPECT=$INPUT_EXPECT" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF_NAME" in
              # Interim release (RELEASE_AUTHORISATION.md, owner authorisation of 2026-10-25): the same production
              # target and gate, run in interim mode (legal pages published as drafts; see scripts/release-gate.mjs).
              publish-production-interim|publish-production-interim-*) TARGET=production; CONFIRM=PUBLISH; echo "UMA_RELEASE_MODE=interim" >> "$GITHUB_ENV" ;;
              publish-production|publish-production-*) TARGET=production; CONFIRM=PUBLISH ;;
              publish-staging|publish-staging-*)       TARGET=staging; CONFIRM="" ;;
              *) echo "tag '$GITHUB_REF_NAME' names no deploy target"; exit 1 ;;
            esac
          else
            TARGET="$INPUT_TARGET"; CONFIRM="$INPUT_CONFIRM"
          fi
          case "$TARGET" in
            verify|staging) ;;
            production) if [ "$CONFIRM" != "PUBLISH" ]; then echo "production requires confirm=PUBLISH"; exit 1; fi ;;
            *) echo "invalid target: '$TARGET'"; exit 1 ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "target=$TARGET (event $GITHUB_EVENT_NAME, ref $GITHUB_REF_NAME)"
      # No token left in .git/config: npm install scripts and test code that run before the gate must not be able to
      # push. Only the deploy step below authenticates, through its own PUSH_URL (audit SEC-2, 2026-10-29).
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - name: Build and test (staging)
        if: ${{ env.TARGET == 'staging' }}
        working-directory: site
        run: |
          npm run test:records && npm run test:publication
          npm run build:staging
          node tests/staging-guard.mjs
          echo "OUT=site/dist-staging" >> "$GITHUB_ENV"
      - name: Install the browser for the UI, accessibility and performance tests
        if: ${{ env.TARGET == 'production' || env.TARGET == 'verify' }}
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Release gate (production) — full suite, clean build, publication report, release readiness
        if: ${{ env.TARGET == 'production' }}
        working-directory: site
        run: |
          node scripts/release-gate.mjs --json "$RUNNER_TEMP/release-gate.json"
          echo "OUT=site/dist" >> "$GITHUB_ENV"
      - name: Release gate (verify) — the same checks, never deploys
        id: verifygate
        if: ${{ env.TARGET == 'verify' }}
        continue-on-error: true
        working-directory: site
        run: node scripts/release-gate.mjs --json "$RUNNER_TEMP/release-gate.json"
      - name: Verify outcome matches the expected release state
        if: ${{ env.TARGET == 'verify' }}
        env:
          GATE_OUTCOME: ${{ steps.verifygate.outcome }}
        run: |
          echo "release gate outcome: $GATE_OUTCOME; expected: ${EXPECT:-blocked}"
          if [ "${EXPECT:-blocked}" = "blocked" ] && [ "$GATE_OUTCOME" != "failure" ]; then
            echo "The release gate PASSED but a refusal was expected (owner legal details are recorded as missing). Check the gate and update the expectation in ci.yml only when the blockers are genuinely resolved."; exit 1; fi
          if [ "${EXPECT:-blocked}" = "pass" ] && [ "$GATE_OUTCOME" != "success" ]; then echo "The release gate FAILED: the candidate is not releasable."; exit 1; fi
          echo "verify: outcome as expected; nothing was deployed."
      - name: Commit the built site onto the deploy branch (fast-forward, never force)
        if: ${{ env.TARGET == 'staging' || env.TARGET == 'production' }}
        env:
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "uma-release-bot"
          git config --global user.email "noreply@ukrainemedicaladmissions.com"
          if [ "$TARGET" = "production" ]; then
            TAG="release-$(date -u +%Y%m%d-%H%M%S)"; MSG="Build ${GITHUB_SHA::7} ($TAG${UMA_RELEASE_MODE:+, $UMA_RELEASE_MODE release: legal pages published as drafts})"
          elif [ "$TARGET" = "staging" ]; then
            TAG=""; MSG="Staging build ${GITHUB_SHA::7} (noindex)"
          else
            echo "unreachable: invalid target"; exit 1
          fi
          # The deploy branch holds ONLY the build output (no source, no project documents). Each publish adds
          # one commit on top of the branch's current head, so Hostinger's pull is always a fast-forward and
          # history is never rewritten. The tree is written from $OUT with a throw-away index.
          PARENT=""
          if git fetch -q "$PUSH_URL" "refs/heads/$TARGET:refs/remotes/origin/$TARGET" 2>/dev/null; then
            PARENT=$(git rev-parse "refs/remotes/origin/$TARGET")
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/deploy-index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$OUT" add -A -f .
          TREE=$(git write-tree)
          if [ -n "$PARENT" ] && [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
            echo "deploy branch already carries this exact build"; COMMIT="$PARENT"
          else
            COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "$MSG")
          fi
          git push "$PUSH_URL" "$COMMIT:refs/heads/$TARGET"
          if [ -n "$TAG" ]; then git tag "$TAG" "$GITHUB_SHA" && git push "$PUSH_URL" "refs/tags/$TAG"; fi
          echo "deploy branch $TARGET -> commit $COMMIT (tree $TREE, $(git ls-tree -r "$TREE" | wc -l) files)"
          git ls-tree --name-only "$TREE"
