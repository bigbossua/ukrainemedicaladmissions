name: Site CI

on:
  push:
    paths: ['site/**', '.github/workflows/ci.yml', 'research/verification/ALLOWLIST_P1.txt', 'research/verification/CAPTURE_REQUEST_2026-10-12.md', 'OWNER_ACTION_SHEET.md']
  pull_request:
    paths: ['site/**', 'research/verification/ALLOWLIST_P1.txt', 'research/verification/CAPTURE_REQUEST_2026-10-12.md', 'OWNER_ACTION_SHEET.md']
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: site }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npx astro check
      - run: npm run test:records
      - run: npm run test:readiness
      - name: Publication gate (twelve adversarial scenarios, JSON-LD breakout regressions, fixture production builds)
        run: npm run test:publication
      - run: npm run test:evidence-tools
      - name: Allowlist consistency (20 hosts = capture request = owner action sheet; offline)
        run: npm run test:allowlist
      - name: Directory name search (full or near matches; look-alike names of separate institutions never a full match)
        run: npm run test:search
      - name: Publication report (fails if a flagged record fails the policy)
        run: npm run report:publication
      - run: npm run build
      - run: npm run test:links
      - name: WhatsApp links (business number only, source-identifying message per page, encoding, accessible names)
        run: npm run test:whatsapp
      - run: npm run test:meta
      - run: npm run test:redirects
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: "Mobile acceptance (320, 360, 390, 430 px: no overflow, menu, controls, tap targets, footer)"
        run: npm run test:mobile
      - run: npm run test:a11y
      - name: Audit regressions 2026-10-29 (directory layout shift, mobile menu scroll, hero focus ring, contact errors, no-script controls, back-forward cache)
        run: npm run test:audit
      - run: npm run test:perf
      - run: npm run test:release
      - run: npm run test:staging
      - run: npm run test:gate
      - run: npm run test:preview
      - run: php -l public/api/enquiry.php
      - run: node tests/enquiry-php.mjs
      - name: Applicant journey end to end (home, directory, profile, pre-selected apply form, review, real handler, thank-you; phone and desktop)
        run: npm run test:journey
      - name: Live smoke checks self-test (production build behind a local stand-in for the server, production .htaccess, defect mutations)
        run: npm run test:verify-live
      - name: Google readiness audit (status, canonical, robots, sitemap, titles, links, structured data, exposure, mobile; fails on a high issue)
        run: npm run test:seo
      - run: npm run test:publish-workflow
      - run: npm run test:release-readiness
      - name: Release gate refuses a failed publication gate and missing legal details (simulations)
        run: npm run test:release-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: site/tests/output, retention-days: 14 }

  # Exercises the REAL publishing workflow (not only the app build) in its non-deploying "verify" mode: the same
  # release gate a production publish runs. While the owner's legal details are missing (LEGAL_COMPLETION_CHECKLIST.md),
  # the gate must REFUSE, so expect is "blocked"; change it to "pass" only when `npm run check:release` passes locally.
  # The called workflow declares contents: write for its deploy targets; target verify never reaches its push step.
  publish-workflow-verify:
    needs: build-and-test
    permissions:
      contents: write
    uses: ./.github/workflows/publish-production-branch.yml
    with:
      target: verify
      expect: blocked

